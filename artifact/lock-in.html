<title>Lock In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one centered study column (max 760px) under a sticky top bar; games take the full column. */
:root {
  --bg: #f6f5ff;
  --surface: #ffffff;
  --surface-2: #eeecfb;
  --text: #1b1733;
  --muted: #625d7d;
  --border: #dedbf1;
  --accent: #6d4aff;
  --accent-hover: #5a37ec;
  --accent-soft: #ebe5ff;
  --on-accent: #ffffff;
  --good: #11875d;
  --good-soft: #dcf5ea;
  --bad: #c9314b;
  --bad-soft: #fde4e8;
  --warn: #9a5a00;
  --warn-soft: #fff1d6;
  --shadow: 0 1px 2px rgba(27, 23, 51, .06), 0 4px 16px rgba(27, 23, 51, .05);
  --font-body: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f0d1a; --surface: #1a1729; --surface-2: #242038; --text: #efedfa; --muted: #a39fbd;
    --border: #312c4a; --accent: #8f73ff; --accent-hover: #a58fff; --accent-soft: #2a2350; --on-accent: #ffffff;
    --good: #3dd598; --good-soft: #143a2c; --bad: #ff6b81; --bad-soft: #43202a; --warn: #ffb547; --warn-soft: #3a2a10;
    --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f0d1a; --surface: #1a1729; --surface-2: #242038; --text: #efedfa; --muted: #a39fbd;
  --border: #312c4a; --accent: #8f73ff; --accent-hover: #a58fff; --accent-soft: #2a2350; --on-accent: #ffffff;
  --good: #3dd598; --good-soft: #143a2c; --bad: #ff6b81; --bad-soft: #43202a; --warn: #ffb547; --warn-soft: #3a2a10;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
button, input, textarea { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: 1.85rem; font-weight: 800; letter-spacing: -.02em; }
h2 { font-size: 1.2rem; font-weight: 700; }
p { margin: 0; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.topbar-inner { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 4px; }
.brand { margin-right: auto; font-weight: 800; font-size: 1.2rem; letter-spacing: -.02em; background: none; border: 0; padding: 4px 0; cursor: pointer; display: flex; align-items: center; gap: 8px; }
.brand .lock { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: .8rem; }
.brand em { font-style: normal; color: var(--accent); }
.navbtn { background: none; border: 0; border-radius: 10px; padding: 7px 10px; font-weight: 600; font-size: .9rem; cursor: pointer; color: var(--muted); }
.navbtn:hover, .navbtn[aria-current="page"] { background: var(--surface-2); color: var(--text); }

main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; display: grid; gap: 22px; }
.stack { display: grid; gap: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.grid2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.eyebrow { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.back { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; font-size: .9rem; justify-self: start; }
.back:hover { color: var(--text); }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.tile { text-align: left; cursor: pointer; display: flex; gap: 14px; align-items: flex-start; transition: border-color .15s, transform .15s; width: 100%; }
.tile:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-1px); }
.tile:disabled { opacity: .5; cursor: not-allowed; }
.tile .ico { width: 44px; height: 44px; flex: none; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 1.35rem; }
.tile b { display: block; font-size: 1.05rem; }
.tile .muted.small { display: block; }
.tile .badge { margin-right: auto; }
.badge { display: inline-block; font-size: .72rem; font-weight: 700; border-radius: 8px; padding: 2px 8px; background: var(--accent-soft); color: var(--accent); }
.badge.good { background: var(--good-soft); color: var(--good); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); padding: 10px 16px; font-weight: 700; cursor: pointer; transition: background .15s, border-color .15s; }
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--on-accent); }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn.big { padding: 13px 20px; font-size: 1.05rem; }
.btn.wide { width: 100%; }
.btn.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, var(--border)); }
.btn.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--border)); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline; }
.dangerlink { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; font-size: .9rem; justify-self: start; }
.dangerlink:hover, .dangerlink.armed { color: var(--bad); }

label.lbl { display: block; font-size: .85rem; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.input { width: 100%; border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 10px 14px; outline: none; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
textarea.input { resize: vertical; min-height: 110px; }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat .num { font-size: 1.7rem; font-weight: 800; font-variant-numeric: tabular-nums; }
@media (max-width: 480px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .stats .stat:last-child { grid-column: span 2; } h1 { font-size: 1.55rem; } }

.hero { display: grid; gap: 10px; padding: 8px 0 4px; }
.hero h1 { font-size: 2.1rem; }
.hero h1 span { color: var(--accent); }

.drop { display: grid; justify-items: center; gap: 4px; text-align: center; padding: 30px 18px; border: 2px dashed var(--border); border-radius: var(--radius); background: var(--surface); cursor: pointer; width: 100%; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop .big { font-size: 1.1rem; font-weight: 700; }
.filelist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.filelist li { display: flex; gap: 10px; align-items: center; padding: 10px 14px; }
.filelist .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.x { margin-left: auto; background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 1rem; border-radius: 8px; padding: 2px 8px; }
.x:hover { color: var(--bad); background: var(--surface-2); }

.notice { border-radius: 12px; padding: 12px 14px; }
.notice.bad { background: var(--bad-soft); color: var(--bad); }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.notice.good { background: var(--good-soft); color: var(--good); }

.spinner { width: 46px; height: 46px; border-radius: 50%; border: 4px solid var(--accent-soft); border-top-color: var(--accent); animation: spin 1s linear infinite; margin: 0 auto; }
@keyframes spin { to { transform: rotate(360deg); } }

.termlist { padding: 0; }
.termrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 14px; padding: 12px 18px; border-top: 1px solid var(--border); }
.termrow:first-child { border-top: 0; }
@media (max-width: 520px) { .termrow { grid-template-columns: 1fr; gap: 2px; } }

/* Games */
.progress { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; flex: 1; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .2s; }
.choices { display: grid; gap: 8px; margin-top: 16px; }
.choices.two { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.choice { display: flex; gap: 12px; align-items: center; text-align: left; width: 100%; border: 2px solid var(--border); background: var(--surface); border-radius: 12px; padding: 12px 14px; font-weight: 600; cursor: pointer; transition: border-color .12s; }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice:disabled { cursor: default; }
.choice .key { width: 28px; height: 28px; flex: none; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; font-size: .8rem; font-weight: 800; }
.choice.right { border-color: var(--good); background: var(--good-soft); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
.choice.dim { opacity: .5; }
.feedback { margin-top: 16px; border-radius: 12px; padding: 14px; }
.feedback.right { background: var(--good-soft); }
.feedback.wrong { background: var(--bad-soft); }
.feedback .head { font-weight: 800; }
.feedback.right .head { color: var(--good); }
.feedback.wrong .head { color: var(--bad); }
.qprompt { font-size: 1.2rem; font-weight: 700; line-height: 1.35; }
.endscore { font-size: 3rem; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
.center { text-align: center; }

.flip { perspective: 1200px; background: none; border: 0; padding: 0; width: 100%; height: 300px; cursor: pointer; }
.flip-inner { position: relative; width: 100%; height: 100%; transition: transform .45s; transform-style: preserve-3d; }
.flip.flipped .flip-inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; display: grid; place-items: center; padding: 28px; overflow: auto; }
.face.back { transform: rotateY(180deg); background: var(--accent-soft); border-color: var(--accent); }
.face .t { font-size: 1.8rem; font-weight: 800; }
.face .d { font-size: 1.1rem; }

.hud { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; text-align: center; }
.hud .panel { padding: 10px; }
.hud .v { font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.hud .v.accent { color: var(--accent); }
.hud .v.low { color: var(--bad); }

.sky { position: relative; height: 400px; overflow: hidden; border-radius: var(--radius); border: 1px solid var(--border); background: linear-gradient(var(--accent-soft), var(--surface)); }
.sky .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: color-mix(in srgb, var(--bad) 45%, transparent); }
.meteor { position: absolute; top: 8px; width: 56%; background: var(--surface); border: 1px solid var(--accent); border-radius: 12px; padding: 10px 12px; font-weight: 600; box-shadow: var(--shadow); will-change: transform; }
.meteor p { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.missed { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; background: color-mix(in srgb, var(--bad-soft) 92%, transparent); padding: 20px; }
.missed .t { font-size: 1.9rem; font-weight: 800; }
.lives { font-size: 1.15rem; letter-spacing: 2px; }
.lives .gone { opacity: .25; }

@keyframes shake { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-6px) } 75% { transform: translateX(6px) } }
.shake { animation: shake .25s ease-in-out 2; }
@keyframes pop { 50% { transform: scale(1.15) } }
.pop { animation: pop .25s ease-out; }
@media (prefers-reduced-motion: reduce) { .shake, .pop, .spinner { animation: none; } .flip-inner { transition: none; } }

/* Progress */
.mastery { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: var(--surface-2); gap: 2px; }
.mastery i { display: block; min-width: 0; }
.m-mastered { background: var(--good); }
.m-learning { background: var(--accent); }
.m-new { background: var(--surface-2); }
.legend { gap: 16px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.dot.m-new { border: 1px solid var(--border); }
.weakspots { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); background: var(--accent-soft); }
.weakspots .ico { background: var(--surface); }

/* Homework */
.modepick { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.modepick .tile[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.bubble-me { justify-self: end; max-width: 85%; background: var(--accent); color: var(--on-accent); border-radius: 16px 16px 4px 16px; padding: 10px 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.reply { overflow-wrap: anywhere; }
.reply h1, .reply h2, .reply h3 { font-size: 1.05rem; margin: .8em 0 .35em; }
.reply p { margin: .5em 0; }
.reply ol, .reply ul { padding-left: 1.4em; margin: .5em 0; }
.reply li { margin: .25em 0; }
.reply code { background: var(--surface-2); border-radius: 6px; padding: .1em .35em; }
.reply pre { background: var(--surface-2); border-radius: 10px; padding: 10px; overflow-x: auto; }
.reply > :first-child { margin-top: 0; }
.reply > :last-child { margin-bottom: 0; }
.dots { display: inline-flex; gap: 5px; padding: 6px 0; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: bounce 1s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 50% { transform: translateY(-5px); } }
.composer { position: sticky; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--bg) 94%, transparent); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px; display: grid; gap: 8px; backdrop-filter: blur(6px); }
.composer .row { flex-wrap: nowrap; }
.composer .row.chips { flex-wrap: wrap; }
.btn.chip { padding: 6px 12px; font-size: .88rem; }
.thumb { max-height: 260px; border-radius: 12px; border: 1px solid var(--border); margin-top: 10px; }
.listbtn { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; cursor: pointer; padding: 12px 16px; }
.listbtn:hover { border-color: var(--accent); }
.listbtn .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>

<header class="topbar">
  <nav class="topbar-inner" aria-label="Main">
    <button class="brand" data-go="home"><span class="lock" aria-hidden="true">🔒</span>Lock <em>In</em></button>
    <button class="navbtn" data-go="new" id="nav-new">+ Study set</button>
    <button class="navbtn" data-go="hw" id="nav-hw">Homework</button>
  </nav>
</header>
<main id="app" aria-live="polite"></main>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.13.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
"use strict";
const PDF_WORKER_URL = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
const MAX_MATERIAL_CHARS = 50000; // Claude reads at most 64 KiB per call; leave room for instructions.

/* ---------- small helpers ---------- */
const $app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clean = (s) => String(s ?? "").trim().replace(/\s+/g, " ");
function shuffle(items) { const a = [...items]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function md(text) {
  try { return DOMPurify.sanitize(marked.parse(text || "")); } catch { return esc(text).replace(/\n/g, "<br>"); }
}

/* ---------- answer matching (same rules as the web app) ---------- */
function normalizeAnswer(s) {
  return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
    .replace(/[^a-z0-9\s]/g, " ").replace(/\b(the|a|an)\b/g, " ").replace(/\s+/g, " ").trim();
}
function levenshtein(a, b) {
  if (a === b) return 0; if (!a.length) return b.length; if (!b.length) return a.length;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
function isCloseEnough(guess, answer) {
  const g = normalizeAnswer(guess), a = normalizeAnswer(answer);
  if (!g || !a) return false;
  if (g === a) return true;
  if (/^\d+$/.test(a)) return false;
  const allowed = a.length <= 4 ? 0 : a.length <= 8 ? 1 : 2;
  return levenshtein(g, a) <= allowed;
}
const streakMultiplier = (s) => Math.min(4, 1 + Math.floor(Math.max(0, s - 1) / 3));
const fallDuration = (n) => Math.max(4, 14 - n * 0.6);

function normalizeStudySet(raw) {
  const set = raw && typeof raw === "object" ? raw : {};
  const seen = new Set();
  const cards = (Array.isArray(set.cards) ? set.cards : [])
    .map((c) => ({ term: clean(c?.term), definition: clean(c?.definition) }))
    .filter((c) => { const k = c.term.toLowerCase(); if (!c.term || !c.definition || seen.has(k)) return false; seen.add(k); return true; });
  const questions = [];
  for (const q of Array.isArray(set.questions) ? set.questions : []) {
    const prompt = clean(q?.prompt), explanation = clean(q?.explanation);
    let answer = clean(q?.answer);
    if (!prompt || !answer) continue;
    if (q.type === "short") { questions.push({ type: "short", prompt, choices: [], answer, explanation }); continue; }
    if (q.type === "true_false") {
      const a = answer.toLowerCase(); if (a !== "true" && a !== "false") continue;
      questions.push({ type: "true_false", prompt, choices: ["True", "False"], answer: a === "true" ? "True" : "False", explanation }); continue;
    }
    const choices = [...new Set((Array.isArray(q.choices) ? q.choices : []).map(clean).filter(Boolean))];
    const match = choices.find((c) => c.toLowerCase() === answer.toLowerCase());
    if (!match || choices.length < 2) continue;
    questions.push({ type: "mcq", prompt, choices, answer: match, explanation });
  }
  return { title: clean(set.title) || "Untitled set", subject: clean(set.subject), cards, questions };
}
function buildSpeedPool(cards, questions) {
  const items = questions.filter((q) => q.type !== "short" && q.choices.includes(q.answer))
    .map((q) => ({ key: questionKey(q), prompt: q.prompt, choices: q.type === "mcq" ? shuffle(q.choices) : q.choices, answer: q.answer }));
  if (cards.length >= 4) for (const c of cards) {
    const others = shuffle(cards.filter((o) => o.term !== c.term)).slice(0, 3).map((o) => o.term);
    items.push({ key: cardKey(c), prompt: c.definition, choices: shuffle([c.term, ...others]), answer: c.term });
  }
  return shuffle(items);
}

/* ---------- spaced repetition ----------
   Every card and question has a level 0-5. Right answers move it up a level and push the next
   review out (days per level below); a wrong answer drops it to 0 so it comes back right away.
   Answering again before an item is due doesn't move it up, so cramming one game can't fake mastery. */
const REVIEW_DAYS = [0, 1, 2, 4, 8, 16];
const DAY_MS = 864e5;
const MASTERED_LEVEL = 4;
function hashStr(s) { let h = 5381; for (const ch of s) h = (Math.imul(h, 33) ^ ch.codePointAt(0)) >>> 0; return h.toString(36); }
function cardKey(c) { return "c:" + normalizeAnswer(c.term); }
function questionKey(q) { return "q:" + hashStr(clean(q.prompt).toLowerCase()); }
function schedule(rec, correct, now) {
  if (correct && rec && rec.due > now) return { ...rec, seen: rec.seen + 1, last: now };
  const box = correct ? Math.min(REVIEW_DAYS.length - 1, (rec?.box ?? 0) + 1) : 0;
  return { box, due: now + REVIEW_DAYS[box] * DAY_MS, seen: (rec?.seen ?? 0) + 1, wrong: (rec?.wrong ?? 0) + (correct ? 0 : 1), last: now };
}
/** Every studyable item in a set, with its progress record (undefined if never seen). */
function setItems(set, progress) {
  const items = progress?.items || {};
  return [
    ...set.cards.map((c) => ({ kind: "card", key: cardKey(c), card: c, label: c.term, rec: items[cardKey(c)] })),
    ...set.questions.map((q) => ({ kind: "question", key: questionKey(q), question: q, label: q.prompt, rec: items[questionKey(q)] })),
  ];
}
function dueItems(set, progress, now) {
  return setItems(set, progress).filter((it) => it.rec && it.rec.due <= now)
    .sort((a, b) => a.rec.box - b.rec.box || a.rec.due - b.rec.due);
}
function masteryCounts(set, progress) {
  const n = { fresh: 0, learning: 0, mastered: 0 };
  for (const it of setItems(set, progress)) n[!it.rec ? "fresh" : it.rec.box >= MASTERED_LEVEL ? "mastered" : "learning"]++;
  return n;
}
function weakSpots(set, progress, limit = 5) {
  return setItems(set, progress).filter((it) => it.rec?.wrong > 0)
    .sort((a, b) => b.rec.wrong - a.rec.wrong || a.rec.box - b.rec.box).slice(0, limit);
}
function nextDueAt(progressDocs, now) {
  let next = Infinity;
  for (const p of progressDocs) for (const r of Object.values(p?.items || {})) if (r.due > now && r.due < next) next = r.due;
  return next;
}
function whenText(t, now) {
  if (!isFinite(t)) return "";
  const days = Math.round((new Date(t).setHours(0, 0, 0, 0) - new Date(now).setHours(0, 0, 0, 0)) / DAY_MS);
  return days <= 0 ? "later today" : days === 1 ? "tomorrow" : `in ${days} days`;
}
function dayKey(d) { return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; }
function studyStreak(times, now = new Date()) {
  const days = new Set(times.map((t) => dayKey(new Date(t))));
  const cur = new Date(now);
  if (!days.has(dayKey(cur))) cur.setDate(cur.getDate() - 1);
  let n = 0; while (days.has(dayKey(cur))) { n++; cur.setDate(cur.getDate() - 1); }
  return n;
}

const store = {
  mode: "loading", db: null, base: "", ready: null,
  async init() {
    let db = null, user = null;
    try { if (window.claude?.use) [db, user] = await Promise.all([claude.use("db"), claude.use("user")]); } catch {}
    const id = user ? await user.id().catch(() => null) : null;
    if (db && id) { this.db = db; this.base = `data/users/${id}`; this.mode = "db"; }
    else this.mode = "local";
  },
  localKey: (kind) => `lockin:${kind}`,
  readLocal(kind) { try { return JSON.parse(localStorage.getItem(this.localKey(kind)) || "{}"); } catch { return {}; } },
  writeLocal(kind, map) { try { localStorage.setItem(this.localKey(kind), JSON.stringify(map)); } catch {} },
  async list(kind) {
    await this.ready;
    if (this.mode === "db") {
      try {
        const snap = await this.db.collection(`${this.base}/${kind}`).get();
        return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      } catch (e) { console.warn("db list failed", e); return []; }
    }
    return Object.entries(this.readLocal(kind)).map(([id, v]) => ({ id, ...v }));
  },
  async get(kind, id) {
    await this.ready;
    if (this.mode === "db") {
      const s = await this.db.doc(`${this.base}/${kind}/${id}`).get();
      return s.exists ? { id, ...s.data() } : null;
    }
    const v = this.readLocal(kind)[id]; return v ? { id, ...v } : null;
  },
  async put(kind, id, value) {
    await this.ready;
    const { id: _drop, ...body } = value;
    if (this.mode === "db") return this.db.doc(`${this.base}/${kind}/${id}`).set(body);
    const map = this.readLocal(kind); map[id] = body; this.writeLocal(kind, map);
  },
  async remove(kind, id) {
    await this.ready;
    if (this.mode === "db") return this.db.doc(`${this.base}/${kind}/${id}`).delete();
    const map = this.readLocal(kind); delete map[id]; this.writeLocal(kind, map);
  },
};
store.ready = store.init();

Give:

/* ---------- reading files in the browser ---------- */
class ReadError extends Error {}
const extOf = (name) => (name.toLowerCase().split(".").pop() || "");
const IMAGE_EXT = ["jpg", "jpeg", "png", "webp", "gif"];

function decodeXml(s) {
  return s.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&apos;/g, "'")
    .replace(/&#x([0-9a-f]+);/gi, (_, h) => String.fromCodePoint(parseInt(h, 16)))
    .replace(/&#(\d+);/g, (_, d) => String.fromCodePoint(Number(d))).replace(/&amp;/g, "&");
}
function drawingParagraphs(xml) {
  const out = [];
  for (const p of xml.match(/<a:p[\s>][\s\S]*?<\/a:p>/g) || []) {
    const text = [...p.matchAll(/<a:t(?:\s[^>]*)?>([\s\S]*?)<\/a:t>/g)].map((m) => decodeXml(m[1])).join("").trim();
    if (text) out.push(text);
  }
  return out;
}
async function readPptx(file) {
  let zip;
  try { zip = await JSZip.loadAsync(await file.arrayBuffer()); } catch { throw new ReadError(`${file.name} couldn't be opened. Try re-saving it as .pptx or PDF.`); }
  const num = (p) => Number(p.match(/(\d+)\.xml$/)?.[1] || 0);
  const slides = Object.keys(zip.files).filter((p) => /^ppt\/slides\/slide\d+\.xml$/.test(p)).sort((a, b) => num(a) - num(b));
  const sections = [];
  for (const [i, path] of slides.entries()) {
    const text = drawingParagraphs(await zip.file(path).async("string"));
    let notes = [];
    const rels = zip.file(path.replace("slides/", "slides/_rels/") + ".rels");
    const target = rels && (await rels.async("string")).match(/Target="\.\.\/notesSlides\/([^"]+)"/)?.[1];
    const nf = target && zip.file(`ppt/notesSlides/${target}`);
    if (nf) notes = drawingParagraphs(await nf.async("string")).filter((t) => !/^\d+$/.test(t));
    if (!text.length && !notes.length) continue;
    let s = `## Slide ${i + 1}\n${text.join("\n")}`;
    if (notes.length) s += `\nSpeaker notes: ${notes.join(" ")}`;
    sections.push(s);
  }
  return sections.join("\n\n");
}
let pdfWorkerLoad = null;
async function readPdf(file) {
  if (!window.pdfjsLib) throw new ReadError("The PDF reader didn't load. Check your connection and reload.");
  // The page can't start workers from the CDN, so load pdf.js's worker code on the page itself;
  // pdf.js then runs it in the main thread.
  pdfWorkerLoad ??= new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = PDF_WORKER_URL; s.onload = resolve; s.onerror = () => { pdfWorkerLoad = null; reject(); };
    document.head.appendChild(s);
  });
  try { await pdfWorkerLoad; } catch { throw new ReadError("The PDF reader didn't load. Check your connection and try again."); }
  let pdf;
  try { pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise; }
  catch { throw new ReadError(`${file.name} couldn't be opened as a PDF.`); }
  const pages = [];
  for (let n = 1; n <= Math.min(pdf.numPages, 300); n++) {
    const content = await (await pdf.getPage(n)).getTextContent();
    const text = content.items.map((it) => (it.str || "") + (it.hasEOL ? "\n" : " ")).join("").replace(/[ \t]+/g, " ").trim();
    if (text) pages.push(`## Page ${n}\n${text}`);
  }
  return pages.join("\n\n");
}
async function readDocx(file) {
  try { return (await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() })).value.trim(); }
  catch { throw new ReadError(`${file.name} couldn't be opened. Try re-saving it as .docx or PDF.`); }
}
/** Returns {text} for documents or {image} for photos. */
async function readFile(file) {
  const ext = extOf(file.name);
  if (IMAGE_EXT.includes(ext) || file.type.startsWith("image/")) return { image: file };
  let text;
  if (ext === "pptx") text = await readPptx(file);
  else if (ext === "pdf") text = await readPdf(file);
  else if (ext === "docx") text = await readDocx(file);
  else if (["txt", "md", "markdown", "csv"].includes(ext)) text = await file.text();
  else if (ext === "ppt" || ext === "doc") throw new ReadError(`Old .${ext} files aren't supported. Save ${file.name} as .${ext}x or PDF, then upload it again.`);
  else throw new ReadError(`${file.name}: unsupported file type. Use PowerPoint (.pptx), PDF, Word (.docx), text, or a photo.`);
  if (!text.trim()) {
    throw new ReadError(ext === "pdf"
      ? `${file.name} has no selectable text (it's probably scanned). Upload photos of the pages instead.`
      : `No text found in ${file.name}. If the slides are mostly pictures, export them as PDF or photos.`);
  }
  return { text: `<material filename="${file.name}">\n${text}\n</material>` };
}

async function generateSet(files, pasted, lim) {
  const showErr = (msg) => { go("new"); setTimeout(() => { const el = document.getElementById("err"); if (el) el.innerHTML = `<p class="notice bad">${esc(msg)}</p>`; }, 0); };
  const lines = ["Reading your material…", "Asking Claude to pick out the key terms…", "Writing flashcards…", "Making tricky wrong answers…", "Checking the quiz…", "Almost ready…"];
  $app.innerHTML = `<div class="panel stack center" style="padding:44px 20px"><div class="spinner"></div><p style="font-weight:700;font-size:1.1rem" id="line">${lines[0]}</p>
    <p class="muted small">Big decks can take a minute or two. Keep this page open.</p><button class="btn" id="stop" style="justify-self:center">Stop</button></div>`;
  let i = 0; const timer = setInterval(() => { i = Math.min(i + 1, lines.length - 1); const el = document.getElementById("line"); if (el) el.textContent = lines[i]; }, 7000);
  const ctl = new AbortController();
  document.getElementById("stop").onclick = () => ctl.abort();
  cleanup = () => { clearInterval(timer); ctl.abort(); };
  try {
    const parts = [], images = [];
    for (const f of files) { const r = await readFile(f); r.text ? parts.push(r.text) : images.push(r.image); }
    if (pasted.trim()) parts.push(`<material filename="pasted notes">\n${pasted.trim()}\n</material>`);
    if (images.length && !lim) throw new ReadError("Photos can't be read in this view. Upload a PDF or paste the text instead.");
    if (lim && images.length > lim.maxCount) throw new ReadError(`Claude can read up to ${lim.maxCount} photos at once. Remove some and try again.`);
    let material = parts.join("\n\n"), cut = false;
    if (material.length > MAX_MATERIAL_CHARS) { material = material.slice(0, MAX_MATERIAL_CHARS); cut = true; }
    const sample = await getSample();
    if (!sample) throw new ReadError("Asking Claude isn't available in this view. Open Lock In on claude.ai while signed in.");
    const prompt = `${GENERATOR_RULES}\n\n${images.length ? `The student also attached ${images.length} photo(s) of their notes; treat them as material.\n\n` : ""}Material:\n${material || "(see the attached photos)"}`;
    const raw = await sample.json(prompt, { signal: ctl.signal, ...(images.length ? { images } : {}) });
    const set = normalizeStudySet(raw);
    if (!set.cards.length && !set.questions.length) throw new ReadError("Couldn't find enough to study in that material.");
    const id = uid();
    await store.put("sets", id, { ...set, createdAt: Date.now(), sources: files.map((f) => f.name), truncated: cut });
    cleanup?.(); cleanup = null;
    go("set", { id, fresh: cut ? "cut" : "yes" });
  } catch (e) {
    cleanup?.(); cleanup = null;
    if (e?.code === "cancelled") return go("new");
    showErr(e instanceof ReadError ? e.message : e?.code ? aiError(e) : "Couldn't save the study set. Try again.");
  }
}

async function bestScores(setId) {
  const best = {};
  for (const a of await store.list("attempts")) if (a.setId === setId && (!best[a.mode] || a.score > best[a.mode].score)) best[a.mode] = a;
  return best;
}
function saveAttempt(setId, mode, score, total) {
  store.put("attempts", uid(), { setId, mode, score, total, at: Date.now() }).catch((e) => console.warn("attempt not saved", e));
}

async function loadProgress(setId) {
  const p = await store.get("progress", setId).catch(() => null);
  return { items: p?.items || {} };
}
// One write at a time per set's progress document.
const progressChains = new Map();
const openRecorders = new Set();
/** Collects right/wrong answers during a game and saves them in one write per flush. */
function progressRecorder(setId) {
  const pending = [];
  const rec = {
    add(key, correct) { pending.push([key, correct, Date.now()]); },
    flush() {
      if (!pending.length) return progressChains.get(setId) || Promise.resolve();
      const batch = pending.splice(0);
      const chain = (progressChains.get(setId) || Promise.resolve()).then(async () => {
        const doc = await loadProgress(setId);
        for (const [key, correct, at] of batch) doc.items[key] = schedule(doc.items[key], correct, at);
        await store.put("progress", setId, doc);
      }).catch((e) => console.warn("progress not saved", e));
      progressChains.set(setId, chain);
      return chain;
    },
    close() { openRecorders.delete(rec); return rec.flush(); },
  };
  openRecorders.add(rec);
  return rec;
}
window.addEventListener("pagehide", () => openRecorders.forEach((r) => r.flush()));

    <section class="panel stack" aria-label="Your progress">
      <div class="row" style="justify-content:space-between"><h2>Your progress</h2><span class="small muted">${Math.round((m.mastered / total) * 100)}% mastered</span></div>

        <i class="m-mastered" style="flex:${m.mastered}"></i><i class="m-learning" style="flex:${m.learning}"></i><i class="m-new" style="flex:${m.fresh}"></i></div>
      <div class="row small legend"><span><b class="dot m-mastered"></b>Mastered ${m.mastered}</span><span><b class="dot m-learning"></b>Learning ${m.learning}</span><span><b class="dot m-new"></b>Not studied yet ${m.fresh}</span></div>

    </section>
    ${weak.length ? `<section class="stack"><h2>Your weak spots</h2><div class="panel termlist">${weak.map((w) => `<div class="termrow"><span>${esc(w.kind === "card" ? w.card.term : w.question.prompt)}${w.kind === "card" ? `<span class="muted small" style="display:block">${esc(w.card.definition)}</span>` : ""}</span><span class="small" style="color:var(--bad);text-align:right">Missed ${w.rec.wrong}×${w.rec.box >= 2 ? ` <span class="badge good">improving</span>` : ""}</span></div>`).join("")}</div></section>` : ""}
    <section class="grid2">${modes.map(([m, ico, name, body, ok]) => `

function gameHeader(set, title) {
  return `<button class="back" data-go="set" data-id="${esc(set.id)}">← ${esc(set.title)}</button><h1>${title}</h1><div id="game" class="stack"></div>`;
}
function endScreen(el, { headline, score, detail = "", replay = "Play again", extra = "", after = "" }, setId, onReplay, onExtra) {
  el.innerHTML = `<div class="panel stack center" style="padding:34px 18px">
    <div class="muted" style="font-weight:700;font-size:1.05rem">${esc(headline)}</div>
    <div class="endscore pop">${esc(score)}</div>${detail ? `<div class="muted">${esc(detail)}</div>` : ""}
    <div class="row" style="justify-content:center;margin-top:8px">${extra ? `<button class="btn" id="extra">${esc(extra)}</button>` : ""}
      <button class="btn primary" id="replay">${esc(replay)}</button><button class="btn" data-go="set" data-id="${esc(setId)}">Back to set</button></div></div>${after}`;
  document.getElementById("replay").onclick = onReplay;
  document.getElementById("replay").focus();
  if (extra) document.getElementById("extra").onclick = onExtra;
}
const cheer = (p) => p >= 0.9 ? "You're locked in 🔒" : p >= 0.7 ? "Nice work 💪" : p >= 0.5 ? "Getting there 📈" : "Keep practicing, you've got this 🌱";

/* Shared question runner (Quiz and Review). Each item: {type, prompt, choices, answer, explanation}.
   onResult(item, ok) fires when the student moves on, so "I was right" is already applied. */
function runQuestions(el, items, { onResult, onDone, label = "Question" }) {
  let idx = 0; const results = [];
  function show() {
    if (idx >= items.length) return onDone(results);
    const q = items[idx];
    el.innerHTML = `<div class="row small muted"><span>${label} ${idx + 1} of ${items.length}</span><div class="progress"><i style="width:${(idx / items.length) * 100}%"></i></div></div>
      <div class="panel">${q.eyebrow ? `<div class="eyebrow" style="margin-bottom:6px">${esc(q.eyebrow)}</div>` : ""}<p class="qprompt">${esc(q.prompt)}</p>
      ${q.type === "short"
        ? `<form class="row" id="sf" style="margin-top:16px;flex-wrap:nowrap"><input class="input" id="sa" autocomplete="off" placeholder="${esc(q.placeholder || "Type your answer")}"><button class="btn primary">Check</button></form>
           ${q.canSkip ? `<button class="linkbtn small" id="idk" style="margin-top:8px">I don't know, show me</button>` : ""}`
        : `<div class="choices">${q.choices.map((c, i) => `<button class="choice" data-c="${i}"><span class="key">${q.type === "true_false" ? c[0] : "ABCD"[i] || i + 1}</span><span>${esc(c)}</span></button>`).join("")}</div>`}
      <div id="fb"></div></div><div id="next"></div>`;
    if (q.type === "short") {
      const input = document.getElementById("sa"); input.focus();
      document.getElementById("sf").onsubmit = (e) => { e.preventDefault(); if (input.value.trim()) answer(input.value); };
      document.getElementById("idk")?.addEventListener("click", () => answer(""));
    } else el.querySelectorAll(".choice").forEach((b) => (b.onclick = () => answer(q.choices[Number(b.dataset.c)])));
  }
  function answer(value) {
    const q = items[idx];
    const ok = q.type === "short" ? isCloseEnough(value, q.answer) : value === q.answer;
    const result = { q, given: value, ok };
    results.push(result);
    el.querySelectorAll(".choice").forEach((b) => {
      const c = q.choices[Number(b.dataset.c)]; b.disabled = true;
      b.classList.add(c === q.answer ? "right" : c === value ? "wrong" : "dim");
    });
    const form = document.getElementById("sf");
    if (form) { form.querySelector("input").disabled = true; form.querySelector("button").hidden = true; }
    document.getElementById("idk")?.remove();
    document.getElementById("fb").innerHTML = `<div class="feedback ${ok ? "right" : "wrong"}"><div class="head">${ok ? "Correct! 🎉" : "Not quite. Answer: " + esc(q.answer)}</div>
      ${q.explanation ? `<p class="small" style="margin-top:4px">${esc(q.explanation)}</p>` : ""}
      ${!ok && q.type === "short" && value ? `<button class="linkbtn small" id="override" style="margin-top:6px">I was right (count it)</button>` : ""}</div>`;
    document.getElementById("override")?.addEventListener("click", (e) => { result.ok = true; e.target.replaceWith(Object.assign(document.createElement("span"), { className: "small", textContent: "Counted as correct." })); });
    document.getElementById("next").innerHTML = `<button class="btn primary big wide" id="nx">${idx + 1 < items.length ? "Next →" : "See my score"}</button>`;
    const nx = document.getElementById("nx"); nx.focus();
    nx.onclick = () => { onResult?.(q, result.ok); idx++; show(); };
  }
  show();
}
function missedList(missed) {
  return missed.length ? `<div class="panel stack"><h2>Review what you missed</h2>${missed.map((m) => `<div class="stack" style="gap:2px;border-top:1px solid var(--border);padding-top:10px">
    <b>${esc(m.q.prompt)}</b><span class="small" style="color:var(--bad)">You said: ${esc(m.given || "(skipped)")}</span>
    <span class="small" style="color:var(--good)">Answer: ${esc(m.q.answer)}</span>${m.q.explanation ? `<span class="small muted">${esc(m.q.explanation)}</span>` : ""}</div>`).join("")}</div>` : "";
}

/* Quiz */
VIEWS.quiz = async ({ id }) => {
  const set = await loadSet(id); if (!set) return;
  $app.innerHTML = gameHeader(set, "Quiz");
  const el = document.getElementById("game");
  const rec = progressRecorder(id);
  cleanup = () => rec.close();
  const prep = (qs) => shuffle(qs).map((q) => (q.type === "mcq" ? { ...q, choices: shuffle(q.choices) } : q));
  function start(qs, retry) {
    const deck = prep(qs);
    runQuestions(el, deck, {
      onResult: (q, ok) => rec.add(questionKey(q), ok),
      onDone: (results) => {
        rec.flush();
        const right = results.filter((r) => r.ok).length, missed = results.filter((r) => !r.ok);
        if (!retry) saveAttempt(id, "quiz", right, deck.length);
        endScreen(el, {
          headline: cheer(right / deck.length), score: `${right}/${deck.length}`,
          detail: retry ? "Retry round (not counted toward your best)" : `${Math.round((right / deck.length) * 100)}% correct`,
          replay: "Take it again", extra: missed.length ? `Retry the ${missed.length} I missed` : "", after: missedList(missed),
        }, id, () => start(set.questions, false), () => start(missed.map((m) => m.q), true));
      },
    });
  }
  start(set.questions, false);
};

/* Review: due items from one set, or from every set ("Study my weak spots"). */
const REVIEW_LIMIT = 20;
VIEWS.review = async ({ id }) => {
  const all = id === "all";
  $app.innerHTML = `<p class="muted">Loading…</p>`;
  let sets;
  if (all) sets = (await store.list("sets")).map((s) => ({ ...s, cards: s.cards || [], questions: s.questions || [] }));
  else { const one = await loadSet(id); if (!one) return; sets = [one]; }
  const progress = new Map(await Promise.all(sets.map(async (s) => [s.id, await loadProgress(s.id)])));
  const now = Date.now();
  const due = sets.flatMap((s) => dueItems(s, progress.get(s.id), now).map((it) => ({ ...it, set: s })))
    .sort((a, b) => a.rec.box - b.rec.box || a.rec.due - b.rec.due).slice(0, REVIEW_LIMIT);
  const back = all ? `<button class="back" data-go="home">← Home</button>` : `<button class="back" data-go="set" data-id="${esc(id)}">← ${esc(sets[0].title)}</button>`;
  $app.innerHTML = `${back}<h1>${all ? "Your weak spots" : "Review"}</h1><div id="game" class="stack"></div>`;
  const el = document.getElementById("game");
  if (!due.length) {
    const next = whenText(nextDueAt([...progress.values()], now), now);
    el.innerHTML = `<div class="panel stack center" style="padding:34px 18px"><div style="font-size:2.4rem">🎉</div><h2>Nothing to review right now</h2>
      <p class="muted">${next ? `Your next review is ${next}.` : "Play a game on any set first. Lock In brings back what you miss."}</p></div>`;
    return;
  }
  const recs = new Map(sets.map((s) => [s.id, progressRecorder(s.id)]));
  cleanup = () => recs.forEach((r) => r.close());
  const items = shuffle(due.slice(0, 6)).concat(shuffle(due.slice(6))).map((it) => {
    const base = it.kind === "card"
      ? { type: "short", prompt: it.card.definition, answer: it.card.term, explanation: "", placeholder: "Type the term", canSkip: true }
      : { ...it.question, choices: it.question.type === "mcq" ? shuffle(it.question.choices) : it.question.choices, canSkip: it.question.type === "short" };
    return { ...base, key: it.key, setId: it.set.id, box: it.rec.box, eyebrow: all ? it.set.title : "" };
  });
  runQuestions(el, items, {
    label: "Item",
    onResult: (q, ok) => recs.get(q.setId).add(q.key, ok),
    onDone: async (results) => {
      el.innerHTML = `<p class="muted">Saving your progress…</p>`;
      await Promise.all([...recs.values()].map((r) => r.flush()));
      const right = results.filter((r) => r.ok).length, missed = results.filter((r) => !r.ok);
      saveAttempt(all ? "all" : id, "review", right, results.length);
      const after = await Promise.all(sets.map((s) => loadProgress(s.id)));
      const next = whenText(nextDueAt(after, Date.now()), Date.now());
      endScreen(el, {
        headline: cheer(right / results.length), score: `${right}/${results.length}`,
        detail: `${right} moved up a level${missed.length ? ` · ${missed.length} will come back soon` : ""}${next ? ` · next review ${next}` : ""}`,
        replay: missed.length ? "Review again" : "Check for more",
        after: missedList(missed),
      }, all ? sets[0]?.id : id, () => go("review", { id }));
      if (all) { const b = el.querySelector('[data-go="set"]'); b.dataset.go = "home"; delete b.dataset.id; b.textContent = "Home"; }
    },
  });
};

/* Flashcards */
VIEWS.flashcards = async ({ id }) => {
  const set = await loadSet(id); if (!set) return;
  const progress = await loadProgress(id);
  $app.innerHTML = gameHeader(set, "Flashcards");
  const el = document.getElementById("game");
  const rec = progressRecorder(id);
  let deck, idx, known, learning, round, flipped, termFirst = true;
  // Due and missed cards first, then new ones, then cards you already know.
  const rank = (c) => { const r = progress.items[cardKey(c)]; return !r ? 1 : r.due <= Date.now() ? 0 : 2; };
  const order = (cards) => shuffle(cards).sort((a, b) => rank(a) - rank(b));
  const start = (cards, r) => { deck = order(cards); idx = 0; known = []; learning = []; round = r; flipped = false; show(); };
  function show() {
    if (idx >= deck.length) return finish();
    const c = deck[idx], front = termFirst ? c.term : c.definition, back = termFirst ? c.definition : c.term;
    el.innerHTML = `<div class="row small muted" style="justify-content:space-between"><span>${round > 1 ? `Round ${round} · ` : ""}Card ${idx + 1} of ${deck.length}</span>
        <button class="navbtn" id="swap">Show ${termFirst ? "definition" : "term"} first ⇄</button></div>
      <button class="flip ${flipped ? "flipped" : ""}" id="card" aria-label="Flip card"><div class="flip-inner">
        <div class="face panel"><p class="${termFirst ? "t" : "d"}">${esc(front)}</p></div>
        <div class="face back panel"><p class="${termFirst ? "d" : "t"}">${esc(back)}</p></div></div></button>
      <p class="muted small center">Tap the card to flip · keyboard: space flips, ← still learning, → know it</p>
      <div class="grid2" style="grid-template-columns:1fr 1fr"><button class="btn bad big" id="no">✗ Still learning</button><button class="btn good big" id="yes">✓ Know it</button></div>
      <div class="row small" style="justify-content:center;gap:22px"><span style="color:var(--bad)">Still learning: ${learning.length}</span><span style="color:var(--good)">Know it: ${known.length}</span></div>`;
    document.getElementById("card").onclick = () => { flipped = !flipped; document.getElementById("card").classList.toggle("flipped", flipped); };
    document.getElementById("swap").onclick = () => { termFirst = !termFirst; flipped = false; show(); };
    document.getElementById("yes").onclick = () => mark(true);
    document.getElementById("no").onclick = () => mark(false);
  }
  function mark(ok) {
    if (idx >= deck.length) return;
    (ok ? known : learning).push(deck[idx]); rec.add(cardKey(deck[idx]), ok); idx++; flipped = false;
    if (idx >= deck.length) { rec.flush(); if (round === 1) saveAttempt(id, "flashcards", known.length, deck.length); }
    show();
  }
  function finish() {
    endScreen(el, {
      headline: learning.length ? cheer(known.length / deck.length) : "You know every card 🔒", score: `${known.length}/${deck.length}`,
      detail: learning.length ? `${learning.length} still learning` : "Nothing left to review", replay: "Start over",
      extra: learning.length ? `Study the ${learning.length} I'm still learning` : "",
    }, id, () => start(set.cards, 1), () => start(learning, round + 1));
  }
  const onKey = (e) => {
    if (idx >= deck.length || e.target.tagName === "INPUT") return;
    if (e.key === " ") { e.preventDefault(); document.getElementById("card")?.click(); }
    else if (e.key === "ArrowRight") mark(true);
    else if (e.key === "ArrowLeft") mark(false);
  };
  window.addEventListener("keydown", onKey);
  cleanup = () => { window.removeEventListener("keydown", onKey); rec.close(); };
  start(set.cards, 1);
};

/* Speed Round */
VIEWS.speed = async ({ id }) => {
  const set = await loadSet(id); if (!set) return;
  let best = (await bestScores(id)).speed?.score || 0;
  $app.innerHTML = gameHeader(set, "Speed Round");
  const el = document.getElementById("game");
  const rec = progressRecorder(id);
  const ROUND = 60;
  let pool, idx, points, streak, bestStreak, answered, correct, endsAt, locked, tick;
  function ready() {
    el.innerHTML = `<div class="panel stack center" style="padding:36px 18px"><div style="font-size:2.6rem">⚡</div><h2 style="font-size:1.5rem">60 seconds. Go fast.</h2>
      <p class="muted" style="max-width:380px;margin:0 auto">Answer as many as you can. Every 3 in a row raises your multiplier (up to ×4). A wrong answer resets it. Keys 1–4 work too.</p>
      ${best ? `<p style="color:var(--good);font-weight:700">Your best: ${best} pts</p>` : ""}<button class="btn primary big" id="go" style="justify-self:center">Start</button></div>`;
    document.getElementById("go").onclick = startRound; document.getElementById("go").focus();
  }
  function startRound() {
    pool = buildSpeedPool(set.cards, set.questions); idx = 0; points = 0; streak = 0; bestStreak = 0; answered = 0; correct = 0; locked = false;
    endsAt = Date.now() + ROUND * 1000;
    el.innerHTML = `<div class="hud"><div class="panel"><div class="v" id="time">60s</div><div class="muted small">left</div></div>
      <div class="panel"><div class="v accent" id="pts">0</div><div class="muted small">points</div></div>
      <div class="panel"><div class="v" id="stk">–</div><div class="muted small" id="mult">next ×1</div></div></div>
      <div class="progress" style="flex:none"><i id="bar" style="width:100%;transition:none"></i></div><div class="panel" id="q"></div>`;
    tick = setInterval(() => {
      const left = Math.max(0, (endsAt - Date.now()) / 1000);
      const t = document.getElementById("time"); if (!t) return;
      t.textContent = Math.ceil(left) + "s"; t.classList.toggle("low", left < 10);
      document.getElementById("bar").style.width = (left / ROUND) * 100 + "%";
      if (left <= 0) finish();
    }, 100);
    showQ();
  }
  function showQ() {
    const it = pool[idx % pool.length];
    document.getElementById("q").innerHTML = `<p class="qprompt" style="font-size:1.08rem">${esc(it.prompt)}</p><div class="choices two">${it.choices.map((c, i) => `<button class="choice" data-c="${i}"><span class="key">${i + 1}</span><span>${esc(c)}</span></button>`).join("")}</div>`;
    document.querySelectorAll("#q .choice").forEach((b) => (b.onclick = () => choose(Number(b.dataset.c))));
  }
  function choose(i) {
    if (locked || !document.getElementById("q")) return;
    const it = pool[idx % pool.length]; if (i >= it.choices.length) return;
    locked = true; answered++;
    const ok = it.choices[i] === it.answer;
    rec.add(it.key, ok);
    document.querySelectorAll("#q .choice").forEach((b, j) => b.classList.add(it.choices[j] === it.answer ? "right" : j === i ? "wrong" : "dim"));
    if (ok) { streak++; bestStreak = Math.max(bestStreak, streak); correct++; points += 100 * streakMultiplier(streak); }
    else { streak = 0; document.getElementById("q").classList.add("shake"); }
    const p = document.getElementById("pts"); p.textContent = points; p.classList.remove("pop"); void p.offsetWidth; p.classList.add("pop");
    document.getElementById("stk").textContent = streak ? "🔥" + streak : "–";
    document.getElementById("mult").textContent = "next ×" + streakMultiplier(streak + 1);
    setTimeout(() => {
      if (!document.getElementById("q")) return;
      document.getElementById("q").classList.remove("shake");
      idx++; if (idx % pool.length === 0) pool = buildSpeedPool(set.cards, set.questions);
      locked = false; showQ();
    }, ok ? 250 : 900);
  }
  function finish() {
    clearInterval(tick); tick = null;
    rec.flush();
    saveAttempt(id, "speed", points, answered);
    const record = points > best && points > 0; const prev = best; best = Math.max(best, points);
    endScreen(el, { headline: record ? "New high score! 🏆" : "Time's up!", score: `${points} pts`,
      detail: `${correct}/${answered} correct · best streak ${bestStreak}${!record && prev ? ` · high score ${prev}` : ""}` }, id, startRound);
  }
  const onKey = (e) => { const n = Number(e.key); if (tick && n >= 1 && n <= 4) choose(n - 1); };
  window.addEventListener("keydown", onKey);
  cleanup = () => { clearInterval(tick); window.removeEventListener("keydown", onKey); rec.close(); };
  ready();
};

/* Falling Words */
VIEWS.falling = async ({ id }) => {
  const set = await loadSet(id); if (!set) return;
  let best = (await bestScores(id)).falling?.score || 0;
  $app.innerHTML = gameHeader(set, "Falling Words");
  const el = document.getElementById("game");
  const rec = progressRecorder(id);
  const LIVES = 3;
  let deck, card, caught, lives, missed, dropStart, frame, paused, revealTimer;
  function ready() {
    el.innerHTML = `<div class="panel stack center" style="padding:36px 18px"><div style="font-size:2.6rem">☄️</div><h2 style="font-size:1.5rem">Type the term before it lands</h2>
      <p class="muted" style="max-width:400px;margin:0 auto">A definition falls from the sky. Type the matching term and press Enter. Small typos are OK. It speeds up as you go, and you have ${LIVES} lives.</p>
      ${best ? `<p style="color:var(--good);font-weight:700">Your best: ${best} caught</p>` : ""}<button class="btn primary big" id="go" style="justify-self:center">Start</button></div>`;
    document.getElementById("go").onclick = start; document.getElementById("go").focus();
  }
  function start() {
    deck = shuffle(set.cards); caught = 0; lives = LIVES; missed = []; paused = false;
    el.innerHTML = `<div class="row" style="justify-content:space-between"><b style="font-size:1.1rem">Caught: <span id="caught" style="color:var(--accent)">0</span></b><span class="lives" id="lives"></span></div>
      <div class="sky" id="sky"><div class="ground"></div></div>
      <form class="row" id="ff" style="flex-wrap:nowrap"><input class="input" id="fi" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type the term…" style="font-size:1.05rem"><button class="btn primary">Enter</button></form>`;
    drawLives();
    const input = document.getElementById("fi");
    document.getElementById("ff").onsubmit = (e) => {
      e.preventDefault();
      if (paused || !card || !input.value.trim()) return;
      if (isCloseEnough(input.value, card.term)) { rec.add(cardKey(card), true); caught++; document.getElementById("caught").textContent = caught; next(); }
      else { input.classList.remove("shake"); void input.offsetWidth; input.classList.add("shake"); }
      input.value = "";
    };
    input.focus();
    next();
  }
  function drawLives() { document.getElementById("lives").innerHTML = "❤️".repeat(lives) + `<span class="gone">${"🖤".repeat(LIVES - lives)}</span>`; }
  function next() {
    cancelAnimationFrame(frame);
    if (!deck.length) deck = shuffle(set.cards);
    card = deck.pop();
    const sky = document.getElementById("sky");
    sky.querySelector(".meteor")?.remove(); sky.querySelector(".missed")?.remove();
    const m = document.createElement("div"); m.className = "meteor"; m.style.left = 5 + Math.random() * 35 + "%";
    m.innerHTML = `<p>${esc(card.definition)}</p>`; sky.appendChild(m);
    dropStart = performance.now();
    const step = (now) => {
      const progress = (now - dropStart) / 1000 / fallDuration(caught);
      const maxY = sky.clientHeight - m.offsetHeight - 16;
      m.style.transform = `translateY(${Math.min(progress, 1) * maxY}px)`;
      if (progress >= 1) return miss();
      frame = requestAnimationFrame(step);
    };
    frame = requestAnimationFrame(step);
  }
  function miss() {
    paused = true; lives--; missed.push(card); rec.add(cardKey(card), false); drawLives();
    const sky = document.getElementById("sky"); sky.querySelector(".meteor")?.remove();
    const r = document.createElement("div"); r.className = "missed";
    r.innerHTML = `<div><div class="small" style="color:var(--bad);font-weight:700">Missed! It was</div><div class="t pop">${esc(card.term)}</div></div>`; sky.appendChild(r);
    revealTimer = setTimeout(() => {
      paused = false;
      if (lives <= 0) return finish();
      next(); document.getElementById("fi")?.focus();
    }, 1800);
  }
  function finish() {
    cancelAnimationFrame(frame); card = null;
    rec.flush();
    saveAttempt(id, "falling", caught, caught + missed.length);
    const record = caught > best && caught > 0; const prev = best; best = Math.max(best, caught);
    endScreen(el, { headline: record ? "New high score! 🏆" : "Game over", score: `${caught} caught`, detail: !record && prev ? `Your best: ${prev}` : "",
      after: missed.length ? `<div class="panel termlist"><div class="termrow"><b>The ones that got away</b><span></span></div>${missed.map((c) => `<div class="termrow"><b style="color:var(--good)">${esc(c.term)}</b><span class="muted">${esc(c.definition)}</span></div>`).join("")}</div>` : "" }, id, start);
  }
  cleanup = () => { cancelAnimationFrame(frame); clearTimeout(revealTimer); rec.close(); };
  ready();
};

/* Homework */
VIEWS.hw = async () => {
  let mode = "tutor", photo = null;
  const lim = await imageLimits();
  $app.innerHTML = `
    <div class="stack"><h1>Homework helper</h1><p class="muted">Type the problem${lim ? " or add a photo of it" : ""}.</p></div>
    <div class="modepick">
      <button class="panel tile" data-m="tutor" aria-pressed="true"><span class="ico" aria-hidden="true">🧑‍🏫</span><span><b>Tutor me</b><span class="muted small">Walk me through it one step at a time so I learn it.</span></span></button>
      <button class="panel tile" data-m="solve" aria-pressed="false"><span class="ico" aria-hidden="true">✅</span><span><b>Steps + answer</b><span class="muted small">Show me the worked steps and the final answer.</span></span></button>
    </div>
    <div><label class="lbl" for="prob">The problem</label><textarea class="input" id="prob" rows="5" placeholder="e.g. Solve 3x + 7 = 22, or paste a question from your worksheet"></textarea></div>
    ${lim ? `<div class="row"><button class="btn" id="addphoto" type="button">📷 Add a photo</button><span class="small muted" id="pname"></span><input type="file" id="photo" accept="${esc(lim.mediaTypes.join(","))}" hidden></div>` : ""}
    <button class="btn primary big wide" id="start" disabled>Start tutoring →</button>`;
  const prob = document.getElementById("prob"), startBtn = document.getElementById("start");
  const refresh = () => { startBtn.disabled = !prob.value.trim() && !photo; startBtn.textContent = mode === "tutor" ? "Start tutoring →" : "Solve it →"; };
  $app.querySelectorAll("[data-m]").forEach((b) => (b.onclick = () => { mode = b.dataset.m; $app.querySelectorAll("[data-m]").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); refresh(); }));
  prob.oninput = refresh;
  if (lim) {
    const input = document.getElementById("photo");
    document.getElementById("addphoto").onclick = () => input.click();
    input.onchange = () => { photo = input.files[0] || null; document.getElementById("pname").textContent = photo ? photo.name : ""; document.getElementById("addphoto").textContent = photo ? "📷 Change photo" : "📷 Add a photo"; refresh(); };
  }
  startBtn.onclick = async () => {
    const text = prob.value.trim();
    const hw = { mode, problem: text, hasPhoto: !!photo, title: text.slice(0, 90) || "Photo problem", messages: [], createdAt: Date.now() };
    const id = uid();
    startBtn.disabled = true;
    try { await store.put("homework", id, hw); } catch { startBtn.disabled = false; return; }
    go("hwSession", { id, photo, start: true });
  };
};

VIEWS.hwSession = async ({ id, photo, start }) => {
  const hw = await store.get("homework", id).catch(() => null);
  if (!hw) { $app.innerHTML = `<div class="panel stack"><p><b>That homework wasn't found.</b></p><button class="btn" data-go="hw" style="justify-self:start">New problem</button></div>`; return; }
  hw.messages ||= [];
  let busy = false, ctl = null;
  const photoUrl = photo ? URL.createObjectURL(photo) : null;
  $app.innerHTML = `
    <button class="back" data-go="hw">← New problem</button>
    <div class="row"><h1 style="font-size:1.5rem">Homework</h1><span class="badge" id="modebadge"></span></div>
    <div class="panel"><div class="eyebrow" style="color:var(--muted)">Your problem</div>
      ${hw.problem ? `<p style="white-space:pre-wrap;margin-top:4px">${esc(hw.problem)}</p>` : ""}
      ${photoUrl ? `<img class="thumb" src="${photoUrl}" alt="Homework photo">` : hw.hasPhoto ? `<p class="muted small" style="margin-top:4px">📷 Photo attached (the first reply transcribes it).</p>` : ""}</div>
    <div class="stack" id="thread"></div>
    <form class="composer" id="composer">
      <div class="row"><input class="input" id="msg" autocomplete="off"><button class="btn primary" id="send">Send</button><button class="btn" id="stop" type="button" hidden>Stop</button></div>
      <div class="row chips" id="chips"></div>
    </form>`;
  const thread = document.getElementById("thread"), msg = document.getElementById("msg");
  function renderChrome() {
    document.getElementById("modebadge").textContent = hw.mode === "tutor" ? "Tutor mode" : "Steps + answer";
    msg.placeholder = hw.mode === "tutor" ? "Type your answer or ask for a hint…" : "Ask a follow-up question…";
    document.getElementById("chips").innerHTML = hw.mode === "tutor"
      ? `<button class="btn chip" type="button" data-say="hint">💡 Hint</button><button class="btn chip" type="button" data-say="answer">✅ Just show me the answer</button>` : "";
    document.getElementById("chips").hidden = hw.mode !== "tutor";
    for (const b of document.querySelectorAll("#composer button, #msg")) if (b.id !== "stop") b.disabled = busy;
    document.getElementById("stop").hidden = !busy;
  }
  function bubble(m) {
    const d = document.createElement("div");
    if (m.role === "user") { d.className = "bubble-me"; d.textContent = m.content; }
    else { d.className = "panel reply"; d.innerHTML = m.content ? md(m.content) : `<span class="dots" aria-label="Thinking"><i></i><i></i><i></i></span>`; }
    thread.appendChild(d); return d;
  }
  hw.messages.forEach(bubble);
  renderChrome();

  async function ask(userText, switchTo) {
    if (busy) return;
    const sample = await getSample();
    if (userText) { hw.messages.push({ role: "user", content: userText }); bubble({ role: "user", content: userText }); }
    if (switchTo) hw.mode = switchTo;
    const out = bubble({ role: "assistant", content: "" });
    out.scrollIntoView({ behavior: "smooth", block: "end" });
    if (!sample) { out.innerHTML = `<p class="notice bad">${esc(aiError({ code: "sampling_disabled" }))}</p>`; return; }
    busy = true; ctl = new AbortController(); renderChrome();
    const rules = hw.mode === "solve" ? SOLVE_RULES : TUTOR_RULES;
    const first = `${rules}\n\nThe student's homework problem:\n${hw.problem || "(see the attached photo)"}${hw.hasPhoto && !photo ? "\n(A photo was attached earlier; use the transcription in your first reply.)" : ""}`;
    // Keep the conversation within Claude's input size: drop the oldest turns, never the problem.
    let turns = hw.messages.slice(-24);
    if (turns[0]?.role === "assistant" && hw.messages.length > 24) turns = turns.slice(1);
    const input = [{ role: "user", content: first }, ...turns];
    if (input[input.length - 1].role === "assistant") input.push({ role: "user", content: "Please continue." });
    try {
      const { text } = await sample(input, {
        cache: false, signal: ctl.signal, ...(photo ? { images: [photo] } : {}),
        onText: ({ text }) => { out.innerHTML = md(text); },
      });
      out.innerHTML = md(text);
      hw.messages.push({ role: "assistant", content: text });
      await store.put("homework", id, hw).catch((e) => console.warn("homework not saved", e));
    } catch (e) {
      const keep = e?.text || "";
      if (keep) { out.innerHTML = md(keep); hw.messages.push({ role: "assistant", content: keep }); store.put("homework", id, hw).catch(() => {}); }
      if (e?.code !== "cancelled" || !keep) {
        const n = document.createElement("p"); n.className = "notice " + (e?.code === "cancelled" ? "warn" : "bad"); n.style.marginTop = keep ? "10px" : "0";
        n.textContent = aiError(e); if (!keep) out.innerHTML = ""; out.appendChild(n);
      }
    } finally {
      busy = false; ctl = null; renderChrome(); msg.focus();
    }
  }
  document.getElementById("composer").onsubmit = (e) => { e.preventDefault(); const t = msg.value.trim(); if (!t) return; msg.value = ""; ask(t); };
  document.getElementById("stop").onclick = () => ctl?.abort();
  document.getElementById("chips").onclick = (e) => {
    const b = e.target.closest("[data-say]"); if (!b) return;
    if (b.dataset.say === "hint") ask("Can I get a hint?");
    else ask("Just show me the full solution and the final answer.", "solve");
  };
  cleanup = () => { ctl?.abort(); if (photoUrl) URL.revokeObjectURL(photoUrl); };
  if (start && !hw.messages.length) ask();
};

go("home");
</script>
